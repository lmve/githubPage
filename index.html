<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>~you — Macintosh</title>
  <meta name="description" content="A terminal-style personal homepage. Think Different.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Hello font: closest open-source match to Apple's SF Pro (Inter). On macOS
       the system SF Pro is used automatically via -apple-system. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <!-- xterm.js (real terminal emulator) + marked (markdown -> tokens) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-unicode11@0.8.0/lib/addon-unicode11.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
</head>
<body>
  <!-- iPhone-style Hello boot screen -->
  <div id="hello-screen">
    <div class="hello-word">Hello</div>
    <div class="hello-lang" id="hello-lang">Think different.</div>
    <div class="hello-hint">tap to begin</div>
  </div>

  <!-- Macintosh terminal window -->
  <div id="app">
    <div id="mac-window">
      <div id="titlebar">
        <div class="window-controls">
          <span class="close"></span>
          <span class="minimize"></span>
          <span class="maximize"></span>
        </div>
        <div class="window-title">Terminal — you@mac</div>
      </div>
      <div id="term-host">
        <div id="term-screen"></div>
      </div>
    </div>
  </div>

  <noscript>
    <pre style="font-family: monospace; padding: 24px;">
Macintosh — this page is a terminal. Please enable JavaScript.

  ls       list directory contents
  cat      print a document
  help     show this help
  bio      about me
    </pre>
  </noscript>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
