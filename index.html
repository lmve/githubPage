<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>~you — Macintosh Terminal</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  
  <!-- xterm.js from CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-unicode11@0.8.0/lib/addon-unicode11.min.js"></script>
  
  <!-- Marked.js for Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  
  <style>
    /* Chicago Font */
    @font-face {
      font-family: 'Chicago';
      src: url('fonts/ChicagoFLF.woff2') format('woff2');
      font-display: swap;
    }

    :root {
      --mac-bg: #ffffff;
      --mac-fg: #000000;
      --mac-gray: #888888;
      --mac-light-gray: #dddddd;
      --mac-border: #000000;
      --mac-titlebar: #dddddd;
      --mac-window-bg: #eeeeee;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--mac-window-bg);
      font-family: 'Chicago', 'Geneva', 'Monaco', monospace;
    }

    #app {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    #mac-window {
      width: 100%;
      max-width: 850px;
      height: 90vh;
      background: var(--mac-bg);
      border: 2px solid var(--mac-border);
      box-shadow: 6px 6px 0px var(--mac-fg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Title Bar */
    #titlebar {
      height: 22px;
      min-height: 22px;
      background: repeating-linear-gradient(
        to bottom,
        var(--mac-titlebar) 0px,
        var(--mac-titlebar) 2px,
        var(--mac-bg) 2px,
        var(--mac-bg) 4px
      );
      border-bottom: 2px solid var(--mac-border);
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 8px;
      user-select: none;
    }

    .window-controls {
      display: flex;
      gap: 6px;
    }

    .window-controls span {
      width: 13px;
      height: 13px;
      border: 1px solid var(--mac-border);
      background: var(--mac-bg);
      cursor: pointer;
    }

    .window-controls .close { background: var(--mac-fg); }
    .window-controls .minimize { background: var(--mac-gray); }
    .window-controls .maximize { background: var(--mac-light-gray); }

    .title {
      flex: 1;
      text-align: center;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.5px;
      color: var(--mac-fg);
    }

    /* Terminal Host */
    #term-host {
      flex: 1;
      padding: 16px 18px 28px 18px;
      overflow: hidden;
      position: relative;
    }

    #term-screen {
      height: 100%;
    }

    #term-screen .xterm {
      height: 100%;
    }

    /* xterm theme override - Macintosh Black & White */
    .xterm .xterm-rows {
      font-family: 'Chicago', 'Geneva', 'Monaco', 'Courier New', monospace !important;
    }

    /* Scanlines Effect */
    #term-host::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0.03) 0 1px,
        transparent 1px 3px
      );
    }

    /* Vignette Effect */
    #term-host::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 11;
      background: radial-gradient(
        ellipse 120% 120% at 50% 50%,
        transparent 55%,
        rgba(0,0,0,0.15) 100%
      );
    }

    /* Selection */
    ::selection {
      background: var(--mac-fg);
      color: var(--mac-bg);
    }

    /* Scrollbar */
    .xterm-viewport {
      scrollbar-width: thin;
      scrollbar-color: var(--mac-fg) transparent;
    }

    .xterm-viewport::-webkit-scrollbar {
      width: 14px;
    }

    .xterm-viewport::-webkit-scrollbar-track {
      background: var(--mac-bg);
      border-left: 1px solid var(--mac-border);
    }

    .xterm-viewport::-webkit-scrollbar-thumb {
      background: var(--mac-light-gray);
      border: 1px solid var(--mac-border);
    }

    /* Responsive */
    @media (max-width: 640px) {
      #app { padding: 4px; }
      #mac-window {
        height: 95vh;
        box-shadow: 3px 3px 0px var(--mac-fg);
      }
      #term-host { padding: 12px 8px 22px 8px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="mac-window">
      <div id="titlebar">
        <div class="window-controls">
          <span class="close"></span>
          <span class="minimize"></span>
          <span class="maximize"></span>
        </div>
        <div class="title">Terminal — you@mac</div>
      </div>
      <div id="term-host">
        <div id="term-screen"></div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
